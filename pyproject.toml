[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surveyrake"
version = "0.1.0"
description = "Hotel guest NPS raked to known stay margins, with trinomial variance, design effect and signal-or-noise verdicts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "surveyrake contributors" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pyyaml>=6.0",
    "ruff>=0.5",
]

[project.scripts]
surveyrake = "surveyrake.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/surveyrake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
